name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run when a human mentions @claude (never on Claude's own comments).
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    # Wall-clock guard for on-demand runs: with no --max-turns cap below, this
    # is the only guard against a stuck run — it bounds Actions-minute cost.
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The rubric is never committed to this repo. It is fetched from
      # edward-sia/.github so one edit there applies to every repo at once.
      # -f makes a moved or deleted rubric fail the job loudly, rather than
      # letting Claude review against no rubric at all.
      - name: Fetch the shared review rubric
        run: |
          mkdir -p .github
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/edward-sia/.github/main/claude-review.md \
            -o .github/claude-review.md

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action reads CLAUDE.md automatically, so the bot follows the
          # repo's constitution and workflow rules with no extra config.
          # On-demand path: tickets can require many turns (repro + fix +
          # multiple retest passes + PR). No --max-turns cap, so timeout-minutes
          # above is the only guard — raise that if runs need more headroom.
          claude_args: |
            --model sonnet
